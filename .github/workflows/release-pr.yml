name: Release (PR merged)

on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@webpractik'

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/v${{ steps.version.outputs.version }}`,
              sha: context.payload.pull_request.merge_commit_sha,
            })

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Generate GitHub Changelog
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack tarball
        id: pack
        run: echo "file=$(npm pack | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to release
        run: gh release upload "v${{ steps.version.outputs.version }}" "${{ steps.pack.outputs.file }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
